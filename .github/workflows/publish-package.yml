name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  MODULE_PATH: ./artifacts/powershell-package/OwnerLens

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run lint

      - name: Set package version from tag
        id: set_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "Expected tag name to start with v, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm test --if-present
      - run: npm run test:components --if-present
      - run: npm run build --if-present
      - name: Publish package
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

  package-powershell-module:
    runs-on: windows-latest
    needs: publish
    environment: package-signing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Package PowerShell module
        shell: pwsh
        run: |
          $version = "${{ needs.publish.outputs.version }}"
          ./scripts/package-powershell-module.ps1 -Version $version

      - name: Azure login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install publishing tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Install-Module PowerShellGet -Force -Scope CurrentUser
          Install-Module PackageManagement -Force -Scope CurrentUser

      - name: Validate PowerShell files to sign
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem $env:MODULE_PATH -Recurse -File |
            Where-Object { $_.Extension -in ".ps1", ".psm1", ".psd1" }

          if (-not $files) {
            throw "No PowerShell files found to sign."
          }

          $files | ForEach-Object { Write-Host "Will sign $($_.FullName)" }

      - name: Sign PowerShell files with Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\artifacts\powershell-package\OwnerLens
          files-folder-filter: ps1,psm1,psd1
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify PowerShell signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = Get-ChildItem $env:MODULE_PATH -Recurse -File |
            Where-Object { $_.Extension -in ".ps1", ".psm1", ".psd1" }

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName

            if ($sig.Status -ne "Valid") {
              throw "Authenticode signature is not valid for $($file.FullName): $($sig.Status) - $($sig.StatusMessage)"
            }

            if (-not $sig.TimeStamperCertificate) {
              throw "Missing timestamp: $($file.FullName)"
            }

            Write-Host "Signed: $($file.Name) / Status: $($sig.Status)"
          }

      - name: Refresh signed PowerShell module release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ needs.publish.outputs.version }}"
          $zipPath = "artifacts/release/OwnerLens-$version-win-x64.zip"
          $checksumPath = "$zipPath.sha256"

          Remove-Item -LiteralPath $zipPath, $checksumPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $env:MODULE_PATH -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = Get-FileHash -Path $zipPath -Algorithm SHA256
          Set-Content -Path $checksumPath -Value "$($hash.Hash.ToLowerInvariant())  $(Split-Path -Leaf $zipPath)" -Encoding ascii

      - name: Upload PowerShell module release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.publish.outputs.version }}"
          $tag = $env:GITHUB_REF_NAME
          $zipPath = "artifacts/release/OwnerLens-$version-win-x64.zip"
          $checksumPath = "$zipPath.sha256"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title $tag --notes ""
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release for $tag."
            }
          }

          gh release upload $tag $zipPath $checksumPath --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload PowerShell module release assets for $tag."
          }

      - name: Publish module to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Publish-Module `
            -Path $env:MODULE_PATH `
            -NuGetApiKey $env:PSGALLERY_API_KEY `
            -Verbose
